name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  DUCKDB_DOWNLOAD_LIB: "1"

jobs:
  test-rust:
    name: Rust Test Suite & Benchmark Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (WebKitGTK)
        # Some hosted-runner Ubuntu mirrors need over 10 minutes for WebKit.
        # Keep a bounded install budget without restarting completed downloads.
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev xvfb dbus-x11 at-spi2-core

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # Cached build-script output can survive without DuckDB's downloaded shared library.
      - name: Install locked DuckDB native library
        shell: bash
        run: |
          duckdb_version=$(python3 - <<'PY'
          import tomllib
          from pathlib import Path
          packages = tomllib.loads(Path("Cargo.lock").read_text())["package"]
          version = next(p["version"] for p in packages if p["name"] == "libduckdb-sys")
          encoded = int(version.split(".")[1])
          print(f"{encoded // 10000}.{encoded // 100 % 100}.{encoded % 100}")
          PY
          )
          duckdb_native_dir="$RUNNER_TEMP/gridloom-duckdb/$duckdb_version"
          mkdir -p "$duckdb_native_dir"
          curl --fail --location --retry 3 \
            "https://github.com/duckdb/duckdb/releases/download/v$duckdb_version/libduckdb-linux-amd64.zip" \
            --output "$duckdb_native_dir/libduckdb.zip"
          unzip -q -o "$duckdb_native_dir/libduckdb.zip" -d "$duckdb_native_dir"
          test -s "$duckdb_native_dir/libduckdb.so"
          echo "DUCKDB_LIB_DIR=$duckdb_native_dir" >> "$GITHUB_ENV"
          echo "DUCKDB_INCLUDE_DIR=$duckdb_native_dir" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$duckdb_native_dir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Test package integrity contracts
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Check workspace
        run: cargo check --workspace

      - name: Run unit & integration tests
        run: cargo test --workspace --verbose

      - name: Run V1 Performance Acceptance Protocol
        run: cargo run -p gridloom-server -- --bench

      - name: Set up Node.js for end-to-end checks
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend and install browser
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium

      - name: Build application binaries
        id: binaries
        run: cargo build --locked -p gridloom-server -p gridloom-desktop

      - name: Real browser monthly-close acceptance
        working-directory: ./frontend
        run: npm run test:browser

      - name: Real browser two-million-row SQLite ledger
        working-directory: ./frontend
        run: npm run test:ledger

      - name: Real browser ten-million-row worksheet refresh, navigation and SQL preview
        working-directory: ./frontend
        run: node tests/live-table-10m-smoke.mjs

      - name: Real browser query preview navigation and retry
        working-directory: ./frontend
        run: node tests/query-preview-smoke.mjs

      - name: Real browser worksheet usability
        working-directory: ./frontend
        run: npm run test:usability

      - name: Real browser selection summaries
        working-directory: ./frontend
        run: npm run test:summary

      - name: Real browser save safety
        working-directory: ./frontend
        run: node tests/save-smoke.mjs

      - name: Autosave recovery after process kill
        run: python3 scripts/recovery-crash-smoke.py target/debug/gridloom-server

      - name: Real browser autosave recovery
        working-directory: ./frontend
        run: node tests/recovery-smoke.mjs

      - name: Real browser formula reference locks
        working-directory: ./frontend
        run: node tests/formula-reference-smoke.mjs

      - name: Real browser lookup correctness
        working-directory: ./frontend
        run: node tests/lookup-smoke.mjs

      - name: Real browser function completion
        working-directory: frontend
        run: node tests/function-completion-smoke.mjs

      - name: Real browser worksheet keyboard navigation
        working-directory: frontend
        run: node tests/grid-keyboard-smoke.mjs
      - name: Workbook-local table lifecycle (Chromium)
        working-directory: frontend
        run: node tests/local-table-smoke.mjs

      - name: Real browser function browser
        working-directory: frontend
        run: node tests/function-browser-smoke.mjs

      - name: Real browser rounding correctness
        working-directory: frontend
        run: node tests/rounding-smoke.mjs

      - name: Real browser product and modulo correctness
        working-directory: frontend
        run: npm run test:product-mod

      - name: Real browser SUMPRODUCT correctness
        working-directory: frontend
        run: npm run test:sumproduct

      - name: Real browser CEILING and FLOOR correctness
        working-directory: frontend
        run: npm run test:ceiling-floor

      - name: Real browser formula inspection view
        working-directory: frontend
        run: node tests/show-formulas-smoke.mjs

      - name: Real browser safe row insertion
        working-directory: frontend
        run: node tests/row-insert-smoke.mjs

      - name: Real browser worksheet tab actions
        working-directory: frontend
        run: node tests/sheet-tabs-smoke.mjs

      - name: Real browser worksheet sort and filter
        working-directory: frontend
        run: node tests/sort-filter-smoke.mjs

      - name: Real browser Paste Special
        working-directory: frontend
        run: node tests/paste-special-smoke.mjs

      - name: Real browser saved pivot refresh
        working-directory: frontend
        run: node tests/pivot-refresh-smoke.mjs

      - name: Native window-open smoke
        if: ${{ !cancelled() && steps.binaries.outcome == 'success' }}
        run: scripts/native-window-smoke.sh

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gridloom-smoke-evidence
          path: |
            target/browser-smoke/*.png
            target/browser-smoke/*.log
            target/native-smoke/*.log
            target/usability-smoke/*
            target/selection-summary-smoke/*
            target/save-smoke/*
            target/formula-reference-smoke/*
            target/lookup-smoke/*
            target/function-completion-smoke/*
            target/rounding-smoke/*
            target/product-mod-smoke/*
            target/sumproduct-smoke/*
            target/ceiling-floor-smoke/*
            target/show-formulas-smoke/*

  build-frontend:
    name: Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Test frontend value contracts
        working-directory: ./frontend
        run: npm test

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  package-linux:
    name: Verified Linux release packages
    if: github.event_name == 'push'
    needs: [test-rust, build-frontend]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      GRIDLOOM_PACKAGE_DIR: /tmp/gridloom-packages-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install native build and smoke dependencies
        # Some hosted-runner Ubuntu mirrors need over 10 minutes for WebKit.
        # Keep a bounded install budget without restarting completed downloads.
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev xvfb dbus-x11 at-spi2-core

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache release dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-release-packages

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked DuckDB native library
        shell: bash
        run: |
          duckdb_version=$(python3 - <<'PY'
          import tomllib
          from pathlib import Path
          packages = tomllib.loads(Path("Cargo.lock").read_text())["package"]
          version = next(p["version"] for p in packages if p["name"] == "libduckdb-sys")
          encoded = int(version.split(".")[1])
          print(f"{encoded // 10000}.{encoded // 100 % 100}.{encoded % 100}")
          PY
          )
          duckdb_native_dir="$RUNNER_TEMP/gridloom-duckdb/$duckdb_version"
          mkdir -p "$duckdb_native_dir"
          curl --fail --location --retry 3 \
            "https://github.com/duckdb/duckdb/releases/download/v$duckdb_version/libduckdb-linux-amd64.zip" \
            --output "$duckdb_native_dir/libduckdb.zip"
          unzip -q -o "$duckdb_native_dir/libduckdb.zip" -d "$duckdb_native_dir"
          test -s "$duckdb_native_dir/libduckdb.so"
          echo "DUCKDB_LIB_DIR=$duckdb_native_dir" >> "$GITHUB_ENV"
          echo "DUCKDB_INCLUDE_DIR=$duckdb_native_dir" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$duckdb_native_dir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"


      - name: Build exact-commit server and desktop archives
        run: |
          scripts/package-linux.sh server
          scripts/package-linux.sh desktop

      - name: Verify installation integrity and relocated launch
        shell: bash
        run: |
          set -euo pipefail
          tree=$(git rev-parse HEAD^{tree})
          for archive in "$GRIDLOOM_PACKAGE_DIR"/*.tar.gz; do
            extra=()
            case "$archive" in *-desktop.tar.gz) extra=(--native-window);; esac
            python3 scripts/package-smoke.py "$archive" \
              --expected-commit "$GITHUB_SHA" --expected-tree "$tree" "${extra[@]}" 2>&1 \
              | tee "$archive.smoke.log"
          done

      - name: Upload verified portable Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: gridloom-linux-x86_64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ env.GRIDLOOM_PACKAGE_DIR }}/*.tar.gz
            ${{ env.GRIDLOOM_PACKAGE_DIR }}/*.sha256
            ${{ env.GRIDLOOM_PACKAGE_DIR }}/*.smoke.log

      - name: Upload package failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gridloom-package-diagnostics-${{ github.sha }}
          retention-days: 7
          path: ${{ env.GRIDLOOM_PACKAGE_DIR }}/*.smoke.log
